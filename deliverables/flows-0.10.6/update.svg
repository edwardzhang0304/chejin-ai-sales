ont-family="'PingFang SC'">显示具体等待原因</text><text x="48.166" y="268.44" fill="#000" font-size="14" textLength="196" font-family="'PingFang SC'">继续原安全收尾，不删数据放行</text><ellipse cx="146.166" cy="314.2" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="146.166" cy="314.2" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="305.498" y="224" width="271.555" height="59.2" fill="#FFF" style="stroke:#58718C;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="315.498" y="248.84" fill="#000" font-size="14" textLength="238" font-family="'PingFang SC'">原新工作准入锁内重新检查并登记更新</text><text x="315.498" y="268.44" fill="#000" font-size="14" textLength="251.555" font-family="'PingFang SC'">关闭新任务/转写/模型入口，防重复请求</text><rect x="199.721" y="345.2" width="188" height="39.6" fill="#FFF" style="stroke:#58718C;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="209.721" y="370.04" fill="#000" font-size="14" textLength="168" font-family="'PingFang SC'">查询可信渠道和目标兼容性</text><polygon points="202.51,405.66,384.932,405.66,396.932,417.66,384.932,429.66,202.51,429.66,190.51,417.66,202.51,405.66" fill="#E8F2FE" style="stroke:#58718C;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="202.51" y="422.7" fill="#000" font-size="14" textLength="182.423" font-family="'PingFang SC'">有合法目标且下载/验签成功?</text><text x="176.51" y="412.9" fill="#000" font-size="14" font-family="'PingFang SC'">是</text><text x="396.932" y="412.9" fill="#000" font-size="14" font-family="'PingFang SC'">否</text><rect x="16" y="439.66" width="271.11" height="39.6" fill="#FFF" style="stroke:#58718C;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="26" y="464.5" fill="#000" font-size="14" textLength="251.11" font-family="'PingFang SC'">检查版本/签名/合同/文件清单/保护范围</text><rect x="307.11" y="439.66" width="257.555" height="59.2" fill="#FFF" style="stroke:#58718C;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="317.11" y="464.5" fill="#000" font-size="14" textLength="237.555" font-family="'PingFang SC'