<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>车金 0.10.4 · 全流程图</title><style>*{box-sizing:border-box}body{margin:0;color:#17334f;background:#f7f9fc;font:15px system-ui,"PingFang SC",sans-serif}header{padding:18px 24px;background:white;border-bottom:1px solid #dce4ef}h1{font-size:23px;margin:0 0 7px}p{margin:6px 0;color:#52677b}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}button,a{font:inherit}button{padding:8px 13px;border:1px solid #b7c8db;background:white;border-radius:7px;color:#17334f;cursor:pointer}button[aria-selected=true]{background:#173e68;color:white;border-color:#173e68}a{color:#2361a2}#tools{display:flex;gap:8px;align-items:center;padding:12px 24px;background:#edf3fa}#canvas{height:calc(100vh - 229px);min-height:420px;overflow:auto;padding:16px}#chart{display:block;max-width:none;background:#f7f9fc}small{display:block;padding:8px 24px;color:#52677b}@media print{#tools,nav{display:none}#canvas{height:auto;overflow:visible}#chart{width:100%!important}header{padding:0}small{display:none}}</style><header><h1>车金 0.10.4 · 完整流程</h1><p>r2 · 2026-10-16。主流程保持一整张图；故障、统计和更新单独展开。可放大查看，横向滚动。</p><p>待发布人工交接修复：可靠人工回复先按顺序结清原交接；此前语音保留原状态，迟到及重放结果不重开已处理交接，也不取消后续新问题的回复，不再阻挡后续文字，新语音仍核验，未知调用隔离不解除。</p><nav aria-label="流程选择"><button data-name="main" aria-selected="true">完整业务主流程</button><button data-name="fault" aria-selected="false">故障与恢复</button><button data-name="evidence" aria-selected="false">事实与耗时</button><button data-name="update" aria-selected="false">更新与安装</button></nav></header><div id="tools"><button id="fit">适合宽度</button><button id="actual">原始大小</button><button id="minus" aria-label="缩小">−</button><button id="plus" aria-label="放大">＋</button><span id="scale"></span><a id="source" href="main.svg" target="_blank">单独打开 SVG</a></div><div id="canvas"><img id="chart" src="main.svg" alt="完整业务主流程图"></div><small>唯一源文件：<a href="../AI智能客服售前跟进系统_全流程图_v0.10.4.puml">全流程 UML</a>。下方 SVG 保留当前发布基线；待发布变更见本页说明和 UML 源文件。流程规则不表示全部实机验收已完成。</small><script>const chart=document.getElementById('chart'),canvas=document.getElementById('canvas'),scale=document.getElementById('scale');let zoom=1;function apply(){chart.style.width=Math.round(chart.naturalWidth*zoom)+'px';scale.textContent=Math.round(zoom*100)+'%'}function fit(){zoom=Math.min(1,(canvas.clientWidth-32)/chart.naturalWidth);apply()}chart.onload=fit;document.getElementById('fit').onclick=fit;document.getElementById('actual').onclick=()=>{zoom=1;apply()};document.getElementById('plus').onclick=()=>{zoom=Math.min(2,zoom*1.25);apply()};document.getElementById('minus').onclick=()=>{zoom=Math.max(.1,zoom/1.25);apply()};document.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-name]').forEach(x=>x.setAttribute('aria-selected',String(x===b)));chart.alt=b.textContent;chart.src=b.dataset.name+'.svg';document.getElementById('source').href=chart.src;canvas.scrollTo(0,0)});</script></html>
