[project]
name = "chejin-leads-backend"
version = "0.1.0"
description = "Chejin AI ops backend for manual lead entry, dedupe, assignment and audit."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "sqlalchemy>=2.0.29",
  "uvicorn[standard]>=0.29.0",
  "python-multipart>=0.0.9",
  "cryptography>=42.0.0",
  "alembic>=1.13.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1.18"]
test = ["pytest>=8.2.0", "httpx>=0.27.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
