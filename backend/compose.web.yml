# Use with docker-compose.yml in both rehearsal and production.
services:
  web:
    image: ${FRONTEND_IMAGE:-chejin-ops:0.10.1}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        OPS_READ_ONLY: ${OPS_READ_ONLY:-0}
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
