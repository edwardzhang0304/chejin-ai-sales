# Only gateway/access restrictions differ from the normal deployment.
# Paths are relative to the first file: backend/docker-compose.yml.
services:
  api:
    ports: !reset []
  db:
    ports: !reset []
  web:
    ports: !override
      - "127.0.0.1:${UAT_ADMIN_INTERNAL_PORT:-18815}:8080"
      - "127.0.0.1:${UAT_WORKER_INTERNAL_PORT:-18816}:8081"
    volumes:
      - ${UAT_NGINX_CONFIG:?required}:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      compat:
        condition: service_started
  compat:
    image: ${BACKEND_IMAGE:?required}
    env_file:
      - ${BACKEND_ENV_FILE:?required}
    environment:
      WAIT_FOR_DB: "1"
      RUN_MIGRATIONS: "0"
      C3_OMNIAUTO_ROOT: /app/omniauto-rpa
    command: [uvicorn, ops.hook_uat.compat:app, --host, 0.0.0.0, --port, "8001", --no-access-log]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
