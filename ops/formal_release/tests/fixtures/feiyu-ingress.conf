server {
    listen 80;
    listen [::]:80;
    server_name feiyu.jiangsuchejin.com;

    root /var/www/letsencrypt;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://feiyu.jiangsuchejin.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name feiyu.jiangsuchejin.com;

    ssl_certificate /etc/letsencrypt/live/feiyu.jiangsuchejin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feiyu.jiangsuchejin.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    server_tokens off;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok","service":"feiyu-webhook-gateway"}';
    }

    location = /webhooks/feiyu/clue {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 15s;
    }

    location / {
        return 404;
    }

    access_log /var/log/nginx/feiyu.jiangsuchejin.access.log;
    error_log /var/log/nginx/feiyu.jiangsuchejin.error.log warn;
}
