# Included in the primary API server block. Device/IP are not rollout gates.
# This release admits all devices on the verified 0.10.18 -> 0.10.19 path.
# Change only the verified origin/target set after sealed-package acceptance;
# updater capability, channel/platform validation and query throttles stay in API.
location = /api/client-releases/latest {
    if ($arg_current_version !~ "^(0[.]10[.]18|0[.]10[.]19)$") { return 403; }
    if ($arg_channel != "gray-hook") { return 403; }
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 120s;
    add_header Cache-Control "no-store" always;
    access_log off;
}
