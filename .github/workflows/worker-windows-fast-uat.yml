name: Worker Windows fast UAT ZIP

on:
  push:
    branches:
      - codex/gray-release-0.9.x
  workflow_dispatch:
    inputs:
      uat_label:
        description: Human-readable UAT iteration label
        required: true
        default: binding-c0-c4

permissions:
  contents: read

jobs:
  fast-uat:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CHEJIN_VISION_CLIENT_API_KEY: ${{ secrets.CHEJIN_VISION_CLIENT_API_KEY }}

    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.10
          cache: pip
          cache-dependency-path: worker-client/requirements.txt

      - name: Restore reusable portable runtime base
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: worker-client/.fast-uat-runtime
          key: chejin-fast-uat-runtime-windows-py31210-${{ hashFiles('worker-client/requirements.txt') }}

      - name: Install test dependencies
        working-directory: worker-client
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run local automation gate
        working-directory: worker-client
        shell: powershell
        run: |
          python run_checks.py
          if ($LASTEXITCODE -ne 0) {
            throw "Worker local automation gate failed"
          }

      - name: Build reusable portable runtime base on cache miss
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        working-directory: worker-client
        shell: powershell
        run: |
          .\scripts\build-fast-uat-runtime.ps1 -OutputDir ".fast-uat-runtime" -PythonVersion "3.12.10"

      - name: Assemble business overlay and Fast UAT ZIP
        working-directory: worker-client
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = Join-Path $PWD "dist\fast-uat-release"
          python scripts\build-fast-uat-package.py `
            --runtime-root .fast-uat-runtime `
            --output-dir $releaseDir `
            --git-commit $env:GITHUB_SHA `
            --git-branch $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) {
            throw "Fast UAT ZIP assembly failed"
          }

      - name: Validate extracted Fast UAT runtime and identity
        working-directory: worker-client
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = Join-Path $PWD "dist\fast-uat-release"
          $zip = Get-ChildItem -Path $releaseDir -Filter "chejin-worker-fast-uat-*.zip" -File
          if (@($zip).Count -ne 1) {
            throw "Expected exactly one Fast UAT ZIP"
          }
          $verifyDir = Join-Path $env:RUNNER_TEMP "chejin-fast-uat-verify"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $verifyDir -Force
          $packageRoot = Join-Path $verifyDir "CheJinWorkerDebug"
          $manifestPath = Join-Path $packageRoot "fast-uat-manifest.json"
          $manifest = Get-Content -Raw -Encoding UTF8 $manifestPath | ConvertFrom-Json
          if ($manifest.debug_uat -ne $true -or $manifest.formal_release -ne $false -or $manifest.not_for_customer_release -ne $true -or $manifest.git_dirty -ne $false) {
            throw "Fast UAT identity is not explicit"
          }
          if ($manifest.git_commit -ne $env:GITHUB_SHA) {
            throw "Fast UAT source commit mismatch"
          }
          if ([string]$manifest.omniauto_upstream_base_commit -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Fast UAT OmniAuto source identity is incomplete"
          }
          $launcher = Join-Path $packageRoot "start-fast-uat.ps1"
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($launcher, [ref]$null, [ref]$parseErrors) | Out-Null
          if (@($parseErrors).Count -ne 0) {
            throw "Fast UAT launcher failed Windows PowerShell 5.1 parsing"
          }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $launcher `
            -ApiBaseUrl "http://127.0.0.1:8000/api" -PreflightOnly -SkipBackend -SkipWechat
          if ($LASTEXITCODE -ne 0) {
            throw "Extracted Fast UAT runtime preflight failed"
          }
          $secretValue = [string]$env:CHEJIN_VISION_CLIENT_API_KEY
          $safeManifest = Get-Content -Raw -Encoding UTF8 $manifestPath
          if (-not [string]::IsNullOrWhiteSpace($secretValue) -and $safeManifest.Contains($secretValue)) {
            throw "Fast UAT public manifest leaked the Vision credential"
          }
          Get-FileHash -Algorithm SHA256 $zip.FullName | Format-List

      - name: Upload Fast UAT ZIP
        uses: actions/upload-artifact@v4
        with:
          name: chejin-worker-fast-uat-v0.9.22-${{ github.sha }}
          path: worker-client/dist/fast-uat-release/chejin-worker-fast-uat-*.zip
          if-no-files-found: error
          retention-days: 14
