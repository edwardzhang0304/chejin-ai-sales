name: Worker Windows fast UAT ZIP

on:
  push:
    branches:
      - codex/gray-release-0.9.x
  workflow_dispatch:
    inputs:
      uat_label:
        description: Human-readable UAT iteration label
        required: true
        default: binding-c0-c4

permissions:
  contents: read

jobs:
  fast-uat:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CHEJIN_VISION_CLIENT_API_KEY: ${{ secrets.CHEJIN_VISION_CLIENT_API_KEY }}

    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.10
          cache: pip
          cache-dependency-path: |
            worker-client/requirements.txt
            backend/requirements.txt

      - name: Restore reusable portable runtime base
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: worker-client/.fast-uat-runtime
          key: chejin-fast-uat-runtime-windows-py31210-${{ hashFiles('worker-client/requirements.txt') }}

      - name: Install test dependencies
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check pytest httpx2 `
            -r worker-client/requirements.txt `
            -r backend/requirements.txt

      - name: Run affected Worker and backend read-settlement tests
        working-directory: .
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:CHEJIN_WORKER_HOME = Join-Path $env:RUNNER_TEMP "chejin-worker-affected-tests"
          $env:PYTHONPATH = "$PWD\worker-client;$PWD\backend"
          python -m pytest worker-client/tests/test_task_runner.py -q `
            -k "visible_unread or inconclusive or inflight_flow or confirmed_ai_reply or image or candidate or continuity"
          if ($LASTEXITCODE -ne 0) {
            throw "Affected Worker read-settlement tests failed"
          }
          python -m pytest `
            worker-client/tests/test_c2_vision_integration.py `
            worker-client/tests/test_transaction_outcomes.py -q
          if ($LASTEXITCODE -ne 0) {
            throw "Affected image candidate and read-run receipt tests failed"
          }
          python -m pytest backend/tests/test_wechat_c2_api.py backend/tests/test_worker_client_api.py -q `
            -k "visible_unread or inconclusive or inflight_flow"
          if ($LASTEXITCODE -ne 0) {
            throw "Affected backend read-settlement tests failed"
          }

      - name: Run affected Worker recovery compatibility tests
        working-directory: worker-client
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:CHEJIN_WORKER_HOME = Join-Path $env:RUNNER_TEMP "chejin-worker-affected-tests"
          $affectedFiles = @(
            "test_storage.py",
            "test_ui_contract.py",
            "test_web_ui_binding_behavior.py"
          )
          foreach ($testFile in $affectedFiles) {
            python -m unittest discover -s tests -p $testFile
            if ($LASTEXITCODE -ne 0) {
              throw "Affected Worker recovery test failed: $testFile"
            }
          }
          python -m unittest discover -s tests -p "test_task_runner.py" `
            -k restart -k faulted_is_persisted_locally_before_backend_sync
          if ($LASTEXITCODE -ne 0) {
            throw "Affected restart and fault-state tests failed"
          }

      - name: Run affected Brain context and Provider-input tests
        working-directory: .
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONUTF8 = "1"
          $env:PYTHONPATH = "$PWD\worker-client;$PWD\backend"
          python -m pytest backend/tests/test_c3_api.py backend/tests/test_c3_brain_context_bridge.py -q
          if ($LASTEXITCODE -ne 0) {
            throw "Affected Brain context bridge tests failed"
          }
          python worker-client\omniauto-rpa\apps\wechat_ai_customer_service\tests\run_customer_service_brain_contract_checks.py
          if ($LASTEXITCODE -ne 0) {
            throw "Brain Provider-input contract checks failed"
          }

      - name: Compare observability off and on business traces
        working-directory: .
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:CHEJIN_WORKER_HOME = Join-Path $env:RUNNER_TEMP "chejin-worker-observability-neutrality"
          $env:PYTHONPATH = "$PWD\worker-client;$PWD\backend"
          python worker-client\scripts\run-observability-business-neutrality.py
          if ($LASTEXITCODE -ne 0) {
            throw "Observability changed a front-middle-back business trace"
          }

      - name: Run contract and packaging gates
        working-directory: worker-client
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:CHEJIN_WORKER_HOME = Join-Path $env:RUNNER_TEMP "chejin-worker-contract-tests"
          python scripts/generate-c2-observation-schema.py --check
          if ($LASTEXITCODE -ne 0) {
            throw "Generated C2 observation schema is stale"
          }
          $contractFiles = @(
            "test_c2_contract.py",
            "test_packaging_entry.py",
            "test_packaging_scripts.py"
          )
          foreach ($testFile in $contractFiles) {
            python -m unittest discover -s tests -p $testFile
            if ($LASTEXITCODE -ne 0) {
              throw "Contract or packaging gate failed: $testFile"
            }
          }

      - name: Build reusable portable runtime base on cache miss
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        working-directory: worker-client
        shell: powershell
        run: |
          .\scripts\build-fast-uat-runtime.ps1 -OutputDir ".fast-uat-runtime" -PythonVersion "3.12.10"

      - name: Assemble business overlay and Fast UAT ZIP
        working-directory: worker-client
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = Join-Path $PWD "dist\fast-uat-release"
          python scripts\build-fast-uat-package.py `
            --runtime-root .fast-uat-runtime `
            --output-dir $releaseDir `
            --git-commit $env:GITHUB_SHA `
            --git-branch $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) {
            throw "Fast UAT ZIP assembly failed"
          }

      - name: Validate extracted Fast UAT runtime and identity
        working-directory: worker-client
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = Join-Path $PWD "dist\fast-uat-release"
          $zip = Get-ChildItem -Path $releaseDir -Filter "chejin-worker-fast-uat-*.zip" -File
          if (@($zip).Count -ne 1) {
            throw "Expected exactly one Fast UAT ZIP"
          }
          $verifyDir = Join-Path $env:RUNNER_TEMP "chejin-fast-uat-verify"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $verifyDir -Force
          $packageRoot = Join-Path $verifyDir "CheJinWorkerDebug"
          $manifestPath = Join-Path $packageRoot "fast-uat-manifest.json"
          $manifest = Get-Content -Raw -Encoding UTF8 $manifestPath | ConvertFrom-Json
          if ($manifest.debug_uat -ne $true -or $manifest.formal_release -ne $false -or $manifest.not_for_customer_release -ne $true -or $manifest.git_dirty -ne $false) {
            throw "Fast UAT identity is not explicit"
          }
          if ($manifest.git_commit -ne $env:GITHUB_SHA) {
            throw "Fast UAT source commit mismatch"
          }
          if ([string]$manifest.omniauto_upstream_base_commit -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Fast UAT OmniAuto source identity is incomplete"
          }
          $launcher = Join-Path $packageRoot "start-fast-uat.ps1"
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($launcher, [ref]$null, [ref]$parseErrors) | Out-Null
          if (@($parseErrors).Count -ne 0) {
            throw "Fast UAT launcher failed Windows PowerShell 5.1 parsing"
          }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $launcher `
            -ApiBaseUrl "http://127.0.0.1:8000/api" -PreflightOnly -SkipBackend -SkipWechat
          if ($LASTEXITCODE -ne 0) {
            throw "Extracted Fast UAT runtime preflight failed"
          }
          $secretValue = [string]$env:CHEJIN_VISION_CLIENT_API_KEY
          $safeManifest = Get-Content -Raw -Encoding UTF8 $manifestPath
          if (-not [string]::IsNullOrWhiteSpace($secretValue) -and $safeManifest.Contains($secretValue)) {
            throw "Fast UAT public manifest leaked the Vision credential"
          }
          Get-FileHash -Algorithm SHA256 $zip.FullName | Format-List

      - name: Upload Fast UAT ZIP
        uses: actions/upload-artifact@v4
        with:
          name: chejin-worker-fast-uat-v0.9.59-${{ github.sha }}
          path: worker-client/dist/fast-uat-release/chejin-worker-fast-uat-*.zip
          if-no-files-found: error
          retention-days: 14
