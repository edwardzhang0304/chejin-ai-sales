name: Release evidence

on:
  push:
    branches: [codex/gray-release-0.9.x, gray-release-0.10.x]
    paths:
      - 'ops/formal_release/**'
      - '.github/**'
      - 'worker-client/scripts/build-windows.ps1'
      - 'worker-client/run_checks.py'
      - 'worker-client/tests/test_packaging_scripts.py'
      - 'worker-client/tests/test_release_gate_runner.py'
      - 'worker-client/scripts/run-windows-client-upgrade-test.py'
      - 'worker-client/tests/test_windows_upgrade_gate_data.py'
      - 'worker-client/requirements-test.txt'
      - 'backend/requirements.txt'
      - 'backend/app/services/release_readiness.py'
      - 'worker-client/chejin_worker_client/__init__.py'
      - 'worker-client/chejin_worker_client/models.py'
      - 'worker-client/chejin_worker_client/release_package_contract.py'
  workflow_dispatch:
    inputs:
      check_kind:
        type: choice
        options: [tooling, source, sign-existing, repair-updater, launcher, hook-upgrade]
        default: tooling
      source_test_plan:
        description: 'Reviewed explicit pytest selection: {"reason":"...","not_tested":"...","pytest":[{"cwd":"worker-client","nodes":["tests/test_example.py::test_case"]}]}'
        default: '{}'
      existing_build_run:
        description: 'Successful immutable Hook build run; sign-existing only'
        default: ''
      existing_version:
        description: 'Version already inside the sealed ZIP; no rebuild'
        default: ''
      existing_package_sha256:
        description: 'Expected sealed inner ZIP SHA-256'
        default: ''
      old_build_run:
        description: 'Original installed Hook Worker build; updater-only repair'
        default: ''
      publication_run:
        description: 'Successful sign-existing run for the unchanged target ZIP'
        default: ''
      repair_binary_run:
        description: 'Reuse a saved frozen updater when only a checker changed'
        default: ''

permissions:
  contents: read

env:
  CHEJIN_RELEASE_TRANSPORT: ${{ github.ref_name == 'gray-release-0.10.x' && 'hook' || 'ocr' }}

jobs:
  launcher:
    name: Check only Hook launcher directory handoff
    if: github.event_name == 'workflow_dispatch' && inputs.check_kind == 'launcher' && github.ref_name == 'gray-release-0.10.x'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify fixed launcher actual directory rename and existing behavior
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File worker-client/scripts/test-hook-launcher.ps1
          if ($LASTEXITCODE -ne 0) { throw 'HOOK_LAUNCHER_RENAME_FAILED' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File worker-client/scripts/test-hook-setup.ps1
          if ($LASTEXITCODE -ne 0) { throw 'HOOK_SHORTCUT_ENTRY_FAILED' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File worker-client/scripts/test-hook-shortcut-repair.ps1
          if ($LASTEXITCODE -ne 0) { throw 'HOOK_SHORTCUT_REPAIR_LOOKUP_FAILED' }
  hook-upgrade:
    name: Original Hook updater to sealed target
    if: github.event_name == 'workflow_dispatch' && inputs.check_kind == 'hook-upgrade' && github.ref_name == 'gray-release-0.10.x'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      CHEJIN_RELEASE_TRANSPORT: hook
      PYTHONUTF8: '1'
      TARGET_RUN: ${{ inputs.existing_build_run }}
      OLD_RUN: ${{ inputs.old_build_run }}
      SIGN_RUN: ${{ inputs.publication_run }}
      TARGET_VERSION: ${{ inputs.existing_version }}
      TARGET_SHA256: ${{ inputs.existing_package_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.10'}
      - run: python -m pip install --disable-pip-version-check -r backend/requirements.txt 'numpy<2' 'PySide6==6.6.3.1' 'requests==2.32.3' 'psutil==5.9.8' 'websockets==15.0.1' 'PyYAML==6.0.2'
      - name: Verify saved old and target packages without repair or compilation
        run: |
          python ops/formal_release/updater_repair.py prepare --root "$env:RUNNER_TEMP/hook-upgrade" --old-run "$env:OLD_RUN" --target-run "$env:TARGET_RUN" --publication-run "$env:SIGN_RUN" --version "$env:TARGET_VERSION" --sha256 "$env:TARGET_SHA256" --repair-binary-run "$env:TARGET_RUN"
          if ($LASTEXITCODE -ne 0) { throw 'HOOK_SEALED_PACKAGE_PREPARATION_FAILED' }
      - name: Click original settings button with original updater
        run: |
          foreach ($case in @('paused','faulted')) {
            python worker-client/scripts/run-windows-client-upgrade-test.py --plan "$env:RUNNER_TEMP/hook-upgrade/plan.json" --case $case --old-package-root "$env:RUNNER_TEMP/hook-upgrade/old/CheJinWorkerClient" --old-source-root "$env:RUNNER_TEMP/hook-upgrade/old-source/worker-client" --archive "$env:RUNNER_TEMP/hook-upgrade/target/artifact.zip" --release "$env:RUNNER_TEMP/hook-upgrade/release.json" --work-root "$env:RUNNER_TEMP/hook-upgrade/gui" --hook-bound
            if ($LASTEXITCODE -ne 0) { throw "HOOK_ORIGINAL_UPDATER_CHECK_FAILED:$case" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hook-upgrade-${{ inputs.existing_version }}
          path: |
            ${{ runner.temp }}/hook-upgrade/plan.json
            ${{ runner.temp }}/hook-upgrade/gui/**/upgrade-result.json
            ${{ runner.temp }}/hook-upgrade/gui/**/before.png
            ${{ runner.temp }}/hook-upgrade/gui/**/after.png
            ${{ runner.temp }}/hook-upgrade/gui/**/result.json
            ${{ runner.temp }}/hook-upgrade/gui/**/data-checkpoints.json
            ${{ runner.temp }}/hook-upgrade/gui/**/requests.jsonl
            ${{ runner.temp }}/hook-upgrade/gui/**/process.log
          if-no-files-found: error
          retention-days: 90
  repair-updater:
    name: Build only updater repair and exercise original Windows button
    if: github.event_name == 'workflow_dispatch' && inputs.check_kind == 'repair-updater' && github.ref_name == 'gray-release-0.10.x'
    runs-on: windows-latest
    timeout-minutes: 25
    permissions: {contents: read, actions: read}
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN: ${{ inputs.existing_build_run }}
      OLD_BUILD_RUN: ${{ inputs.old_build_run }}
      PUBLICATION_RUN: ${{ inputs.publication_run }}
      REPAIR_BINARY_RUN: ${{ inputs.repair_binary_run }}
      PACKAGE_VERSION: ${{ inputs.existing_version }}
      PACKAGE_SHA256: ${{ inputs.existing_package_sha256 }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.10'}
      - name: Set isolated repair directory
        run: '"REPAIR_ROOT=$env:RUNNER_TEMP/updater-repair" >> $env:GITHUB_ENV'
      - name: Install only updater and isolated GUI check dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt 'numpy<2' 'PySide6==6.6.3.1' 'requests==2.32.3' 'pyinstaller==6.11.1' 'psutil==5.9.8' 'websockets==15.0.1' 'PyYAML==6.0.2'
      - name: Reuse and verify sealed old and target packages
        run: python ops/formal_release/updater_repair.py prepare --root "$env:REPAIR_ROOT" --old-run "$env:OLD_BUILD_RUN" --target-run "$env:BUILD_RUN" --publication-run "$env:PUBLICATION_RUN" --version "$env:PACKAGE_VERSION" --sha256 "$env:PACKAGE_SHA256" --repair-binary-run "$env:REPAIR_BINARY_RUN"
      - name: Build standalone updater only
        if: inputs.repair_binary_run == ''
        working-directory: worker-client
        run: python -m PyInstaller --clean --noconfirm packaging/chejin-updater.spec
      - name: Save standalone updater immediately before any repair checker
        uses: actions/upload-artifact@v4
        with:
          name: frozen-updater-${{ github.run_id }}
          path: worker-client/dist/CheJinUpdater.exe
          if-no-files-found: error
          retention-days: 30
      - name: Sign repair and exercise frozen startup, patch and restoration
        env:
          CHEJIN_RELEASE_SIGNING_KEY_ID: ${{ secrets.CHEJIN_RELEASE_SIGNING_KEY_ID }}
          CHEJIN_RELEASE_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.CHEJIN_RELEASE_SIGNING_PRIVATE_KEY_BASE64 }}
        run: python ops/formal_release/updater_repair.py assemble --root "$env:REPAIR_ROOT" --version "$env:PACKAGE_VERSION"
      - name: Original Worker settings button to unchanged target package
        env:
          CHEJIN_RELEASE_TRANSPORT: hook
        run: |
          python worker-client/scripts/run-windows-client-upgrade-test.py --plan "$env:REPAIR_ROOT/plan.json" --case paused --old-package-root "$env:REPAIR_ROOT/old/CheJinWorkerClient" --old-source-root "$env:REPAIR_ROOT/old-source/worker-client" --archive "$env:REPAIR_ROOT/target/artifact.zip" --release "$env:REPAIR_ROOT/release.json" --work-root "$env:REPAIR_ROOT/gui" --updater-repair "$env:REPAIR_ROOT/repair/repair-updater.ps1" --hook-unbound
          if ($LASTEXITCODE -ne 0) { throw 'PATCHED_UPDATER_BUTTON_CHECK_FAILED' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updater-repair-${{ inputs.existing_version }}
          path: |
            ${{ runner.temp }}/updater-repair/CheJinUpdaterRepair_V*.zip
            ${{ runner.temp }}/updater-repair/repair-checks.json
            ${{ runner.temp }}/updater-repair/gui/upgrade-result.json
            ${{ runner.temp }}/updater-repair/gui/**/result.json
            ${{ runner.temp }}/updater-repair/gui/**/process.log
            ${{ runner.temp }}/updater-repair/gui/*/before.png
            ${{ runner.temp }}/updater-repair/gui/*/after.png
            ${{ runner.temp }}/updater-repair/gui/**/diagnostics.json
          if-no-files-found: error
          retention-days: 90
  sign-existing:
    name: Sign sealed Hook package without rebuilding
    if: github.event_name == 'workflow_dispatch' && inputs.check_kind == 'sign-existing' && github.ref_name == 'gray-release-0.10.x'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.10'}
      - run: python -m pip install --disable-pip-version-check 'cryptography>=42.0,<46'
      - name: Verify immutable GitHub artifact and sign descriptor only
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.existing_build_run }}
          PACKAGE_VERSION: ${{ inputs.existing_version }}
          PACKAGE_SHA256: ${{ inputs.existing_package_sha256 }}
          CHEJIN_RELEASE_SIGNING_KEY_ID: ${{ secrets.CHEJIN_RELEASE_SIGNING_KEY_ID }}
          CHEJIN_RELEASE_SIGNING_PUBLIC_KEY_BASE64: ${{ secrets.CHEJIN_RELEASE_SIGNING_PUBLIC_KEY_BASE64 }}
          CHEJIN_RELEASE_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.CHEJIN_RELEASE_SIGNING_PRIVATE_KEY_BASE64 }}
        run: python ops/formal_release/sign_existing_hook.py --run "$BUILD_RUN" --version "$PACKAGE_VERSION" --sha256 "$PACKAGE_SHA256" --output "$RUNNER_TEMP/hook-publication"
      - uses: actions/upload-artifact@v4
        with:
          name: hook-publication-${{ inputs.existing_version }}
          path: ${{ runner.temp }}/hook-publication
          if-no-files-found: error
          retention-days: 90
  tooling:
    name: Release tools checks
    if: github.event_name == 'push' || inputs.check_kind == 'tooling'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHECK_KIND: tooling
      CHEJIN_RELEASE_TRANSPORT: ocr
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: |
            worker-client/requirements-test.txt
            backend/requirements.txt
      - name: Install toolkit test dependencies
        run: python -m pip install --disable-pip-version-check -r worker-client/requirements-test.txt -r backend/requirements.txt 'cryptography>=42.0,<46' 'PyYAML==6.0.2' 'SQLAlchemy>=2.0,<3' httpx2 'requests==2.32.3'
      - name: Test changed release tooling and record evidence
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/tooling-evidence
        run: python ops/formal_release/run_evidence_checks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tooling-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tooling-evidence
          retention-days: 90
          if-no-files-found: error

  source:
    name: Selected source checks
    if: github.event_name == 'workflow_dispatch' && inputs.check_kind == 'source' && github.ref_name != 'gray-release-0.10.x'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CHECK_KIND: source
      SOURCE_TEST_PLAN: ${{ inputs.source_test_plan }}
      CHEJIN_RPA_MODE: mock
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: |
            worker-client/requirements.txt
            worker-client/requirements-test.txt
            backend/requirements.txt
      - name: Install source test dependencies
        if: fromJSON(inputs.source_test_plan).reviewed_handoff == '' || toJSON(fromJSON(inputs.source_test_plan).pytest) != 'null'
        run: python -m pip install --disable-pip-version-check -r worker-client/requirements.txt -r worker-client/requirements-test.txt -r backend/requirements.txt 'websockets==15.0.1' 'PyYAML==6.0.2' httpx2
      - name: Run only the engineer-reviewed selection
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/source-evidence
          CHEJIN_WORKER_HOME: ${{ runner.temp }}/source-worker-home
        run: python ops/formal_release/run_evidence_checks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-evidence
          retention-days: 90
          if-no-files-found: error

  windows-parser:
    name: Windows build script parser
    if: github.event_name == 'push' || inputs.check_kind == 'tooling'
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install parser and GUI driver dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2' 'PySide6==6.6.3.1' 'websockets==15.0.1' 'cryptography>=42.0,<46'
      - name: Extract formal inline PowerShell without executing it
        run: python ops/formal_release/workflow_scripts.py --workflow .github/workflows/worker-windows-package.yml --output "${{ runner.temp }}/formal-ps"
      - name: Parse formal scripts with Windows PowerShell
        shell: powershell
        run: |
          $scripts = @("worker-client/scripts/build-windows.ps1", "worker-client/scripts/run-windows-updater-process-test.ps1")
          $scripts += @(Get-ChildItem -LiteralPath "${{ runner.temp }}/formal-ps" -Filter *.ps1 | ForEach-Object { $_.FullName })
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($script + ": " + ($errors | Out-String)) }
          }
      - name: Check the GUI driver using a synthetic window before any package build
        run: python worker-client/scripts/run-windows-client-upgrade-test.py --driver-smoke "${{ runner.temp }}/driver-smoke"
      - name: Exercise Hook launcher and one-click setup before any package build
        if: github.ref_name == 'gray-release-0.10.x'
        shell: powershell
        run: |
          .\worker-client\scripts\test-hook-launcher.ps1
          if ($LASTEXITCODE -ne 0) { throw 'HOOK_LAUNCHER_CHECK_FAILED' }
          .\worker-client\scripts\test-hook-setup.ps1
          if ($LASTEXITCODE -ne 0) { throw 'HOOK_ONE_CLICK_SETUP_CHECK_FAILED' }

  native-source:
    name: Selected source checks
    if: github.event_name == 'workflow_dispatch' && inputs.check_kind == 'source' && github.ref_name == 'gray-release-0.10.x'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: {contents: read, actions: read}
    env:
      CHECK_KIND: source
      CHEJIN_RELEASE_TRANSPORT: hook
      SOURCE_TEST_PLAN: ${{ inputs.source_test_plan }}
      CHEJIN_RPA_MODE: mock
      C3_AI_ADAPTER_MODE: mock
      C3_BATCH_RECOVERY_POLL_SECONDS: '0'
      HOOK_TEST_POSTGRES_URL: postgresql+psycopg://postgres@127.0.0.1:18831/hook_test
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: hook_test
        ports: ['18831:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.10'}
      - name: Install isolated source test dependencies
        run: python -m pip install --disable-pip-version-check -r worker-client/requirements.txt -r worker-client/requirements-test.txt -r backend/requirements.txt 'websockets==15.0.1' 'PyYAML==6.0.2' 'opencv-python-headless==4.10.0.84' httpx2
      - name: Prepare test-only shared schema
        run: |
          sudo install -d -m 0700 -o "$(id -u)" /private/tmp/chejin-hook-formal-20261011
          python - <<'PYTHON'
          from sqlalchemy import create_engine,text
          from sqlalchemy.engine import make_url
          import os
          url=make_url(os.environ['HOOK_TEST_POSTGRES_URL'])
          assert url.host=='127.0.0.1' and url.port==18831 and url.database=='hook_test'
          admin=create_engine(url.set(database='postgres'),isolation_level='AUTOCOMMIT')
          with admin.connect() as db:
              for name in ('hook_test','hook_gray_test','chejin_hook_gray_recovery_test'):
                  if not db.execute(text('SELECT 1 FROM pg_database WHERE datname=:name'),{'name':name}).scalar():
                      db.execute(text('CREATE DATABASE "'+name+'"'))
          admin.dispose()
          for name in ('hook_test','hook_gray_test','chejin_hook_gray_recovery_test'):
              engine=create_engine(url.set(database=name))
              with engine.begin() as db:
                  db.execute(text('CREATE SCHEMA IF NOT EXISTS wechat_ai_customer_service'))
              engine.dispose()
          PYTHON
      - name: Run mandatory native and preserved OCR safety tests
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_DIR: ${{ runner.temp }}/native-source-evidence
          CHEJIN_WORKER_HOME: ${{ runner.temp }}/native-source-worker-home
        run: python ops/formal_release/run_evidence_checks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-source-evidence
          retention-days: 90
          if-no-files-found: error
