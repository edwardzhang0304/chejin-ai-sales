name: Worker Windows package gate

on:
  workflow_dispatch:
    inputs:
      release_approved:
        description: C0-C4 Fast UAT passed and formal EXE build is approved
        required: true
        type: boolean
        default: false
      release_reason:
        description: Reference to the completed UAT record
        required: true

      delivery_mode:
        description: Build and stage, retry delivery, or promote an already verified stage
        type: choice
        options: [build_and_stage, stage_existing, check_staged, publish_staged]
        default: build_and_stage
      current_client_version:
        description: Exact installed client version whose updater and trust must accept the package
        required: true
        default: '0.9.69'
      formal_run_id:
        description: Successful formal package run ID (stage_existing only)
        default: ''
      stage_id:
        description: Verified stage ID from delivery summary (check/publish only)
        default: ''
      production_ready:
        description: Backend cutover complete; Workers paused and local queues drained; approve registration
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    name: Validate release authorization and receiver readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ (inputs.delivery_mode == 'publish_staged' || inputs.delivery_mode == 'check_staged') && 'formal-production' || 'formal-staging' }}
    env:
      RELEASE_APPROVED: ${{ inputs.release_approved }}
      RELEASE_REASON: ${{ inputs.release_reason }}
      DELIVERY_MODE: ${{ inputs.delivery_mode }}
      CURRENT_VERSION: ${{ inputs.current_client_version }}
      FORMAL_RUN_ID: ${{ inputs.formal_run_id }}
      STAGE_ID: ${{ inputs.stage_id }}
      PRODUCTION_READY: ${{ inputs.production_ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Run formal delivery regression tests before release work
        run: |
          python -m pip install --disable-pip-version-check 'cryptography>=42.0,<46'
          python -m unittest discover -s ops/formal_release/tests -v
      - name: Validate dispatch without executing input as shell code
        env:
          FORMAL_SSH_KEY: ${{ secrets.FORMAL_SSH_KEY }}
          FORMAL_SSH_HOST: ${{ secrets.FORMAL_SSH_HOST }}
          FORMAL_SSH_PORT: ${{ secrets.FORMAL_SSH_PORT }}
          FORMAL_KNOWN_HOSTS: ${{ secrets.FORMAL_KNOWN_HOSTS }}
        run: |
          python3 ops/formal_release/validate_dispatch.py
          role=stage
          case "$DELIVERY_MODE" in check_staged|publish_staged) role=promote ;; esac
          python3 ops/formal_release/deliver.py preflight --role "$role" --current-version "$CURRENT_VERSION"

  package:
    name: Build signed formal Windows package
    needs: prepare
    if: inputs.delivery_mode == 'build_and_stage'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CHEJIN_RELEASE_SIGNING_KEY_ID: ${{ secrets.CHEJIN_RELEASE_SIGNING_KEY_ID }}
      CHEJIN_RELEASE_SIGNING_PUBLIC_KEY_BASE64: ${{ secrets.CHEJIN_RELEASE_SIGNING_PUBLIC_KEY_BASE64 }}

    steps:
      - name: Enforce completed UAT approval
        shell: powershell
        env:
          RELEASE_APPROVED: ${{ inputs.release_approved }}
          RELEASE_REASON: ${{ inputs.release_reason }}
        run: |
          if ("$env:RELEASE_APPROVED" -ne "true") {
            throw "Formal EXE build is blocked until Fast UAT C0-C4 is approved"
          }
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_REASON)) {
            throw "Formal EXE build requires a completed UAT record reference"
          }

      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.10
          cache: pip
          cache-dependency-path: |
            worker-client/requirements.txt
            worker-client/requirements-test.txt

      - name: Fail fast on native Windows handoff checks
        shell: powershell
        working-directory: worker-client
        run: |
          $ErrorActionPreference = "Stop"
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8"
          $env:PYTHONPATH = $PWD.Path
          $env:CHEJIN_WORKER_HOME = Join-Path $env:RUNNER_TEMP "chejin-native-prebuild"
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r requirements.txt -r requirements-test.txt
          if ($LASTEXITCODE -ne 0) { throw "Native gate dependencies failed" }
          .\.venv\Scripts\python.exe -m pytest tests/test_update_handoff_baseline.py tests/test_post_update_health.py tests/test_update_shutdown_ui.py tests/test_legacy_update_handoff.py -q --junitxml "$env:RUNNER_TEMP/native-prebuild.xml"
          if ($LASTEXITCODE -ne 0) { throw "Native handoff prebuild gate failed" }

      - name: Build and run packaged runtime probes
        shell: powershell
        working-directory: worker-client
        run: |
          .\scripts\build-windows.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "build-windows.ps1 exited with code $LASTEXITCODE"
          }

      - name: Fetch immutable 0.9.69 source for existing-data fixtures
        uses: actions/checkout@v4
        with:
          ref: d9264625d218edfa36a6d4b91940853d7d8db0a1
          path: .old-source
          persist-credentials: false

      - name: Fetch original 0.9.69 formal artifact inside GitHub
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '10013698751'
          run-id: '34106312819'
          github-token: ${{ github.token }}
          path: old-artifact
          merge-multiple: true

      - name: Verify immutable 0.9.69 ZIP before extracting
        shell: powershell
        run: |
          $zip = Join-Path $PWD "old-artifact\chejin-worker-v0.9.69-windows-x64.zip"
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne "B2E4360D2E6FE7567B0EDFD911535E66FA1B1FC0F6CDD0986F4C0F9265A51DB5") { throw "0.9.69 formal ZIP identity mismatch" }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP "old-069-release")

      - name: Exercise real updater process switch and rollback
        shell: powershell
        working-directory: worker-client
        env:
          CHEJIN_RELEASE_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.CHEJIN_RELEASE_SIGNING_PRIVATE_KEY_BASE64 }}
        run: |
          .\scripts\run-windows-updater-process-test.ps1 -PackageDir .\dist\CheJinWorkerClient
          if ($LASTEXITCODE -ne 0) {
            throw "real updater process switch/rollback test failed"
          }

      - name: Validate manifest and packaged executable again
        shell: powershell
        working-directory: worker-client
        run: |
          $ErrorActionPreference = "Stop"
          $reportsDir = Join-Path $PWD "dist\reports"
          $manifestFiles = @(Get-ChildItem -Path $reportsDir -Filter "*.manifest.json" -File)
          if ($manifestFiles.Count -ne 1) {
            throw "expected exactly one package manifest, found $($manifestFiles.Count)"
          }
          $manifestPath = $manifestFiles[0].FullName
          $manifest = Get-Content -Raw -Encoding UTF8 $manifestPath | ConvertFrom-Json
          $packageDir = [string]$manifest.package_dir
          $exePath = [string]$manifest.exe_path

          .\scripts\validate-package.ps1 -PackageDir $packageDir
          if ($manifest.version -ne "0.9.70") {
            throw "unexpected version: $($manifest.version)"
          }
          if ($manifest.default_api_base_url -ne "https://jiangsuchejin.com/api") {
            throw "formal package does not target the production API"
          }
          if ($manifest.git_commit -ne $env:GITHUB_SHA) {
            throw "manifest git commit does not match GitHub source"
          }
          if ($manifest.tests_status -ne "passed" -or $manifest.preflight_status -ne "passed") {
            throw "manifest test gates are not passed"
          }
          if ($manifest.formal_release -ne $true) {
            throw "manifest is not a formal release"
          }
          if ($manifest.vision_credential_embedded -ne $false -or $manifest.vision_credential_source -ne "worker_backend" -or $manifest.vision_configuration_locked -ne $true) {
            throw "manifest does not confirm backend Vision credential configuration"
          }
          if ($manifest.vision_live_probe_check -ne "runtime_after_binding") {
            throw "manifest has an invalid Vision probe lifecycle"
          }
          $exeHash = (Get-FileHash -Algorithm SHA256 $exePath).Hash
          if ($exeHash -ne $manifest.exe_sha256) {
            throw "manifest exe SHA256 mismatch"
          }
          $updaterPath = [string]$manifest.updater_exe_path
          if (-not (Test-Path $updaterPath) -or (Split-Path -Leaf $updaterPath) -ne "CheJinUpdater.exe") {
            throw "manifest does not reference CheJinUpdater.exe"
          }
          if ((Get-FileHash -Algorithm SHA256 $updaterPath).Hash -ne $manifest.updater_exe_sha256) {
            throw "manifest updater SHA256 mismatch"
          }

          $env:CHEJIN_RPA_MODE = "mock"
          $env:CHEJIN_WORKER_HOME = Join-Path $env:RUNNER_TEMP "chejin-worker-runtime-probe"
          $preflightReport = Join-Path $env:RUNNER_TEMP "chejin-worker-packaged-preflight.json"
          $runtimeDiagnostics = Join-Path $env:RUNNER_TEMP "chejin-worker-packaged-diagnostics.jsonl"
          $env:CHEJIN_PACKAGING_DIAGNOSTIC_PATH = $runtimeDiagnostics
          foreach ($probeArgs in @(
            @("--omniauto-sidecar", "--help"),
            @("--omniauto-ocr-probe"),
            @("--preflight", "--skip-backend", "--skip-wechat", "--preflight-format", "json", "--write-report", $preflightReport)
          )) {
            $process = Start-Process -FilePath $exePath -ArgumentList $probeArgs -PassThru
            if (-not $process.WaitForExit(120000)) {
              Stop-Process -Id $process.Id -Force
              throw "packaged executable probe timed out: $($probeArgs -join ' ')"
            }
            if ($process.ExitCode -ne 0) {
              if (Test-Path $preflightReport) {
                Get-Content -Raw -Encoding UTF8 $preflightReport | Write-Host
              }
              if (Test-Path $runtimeDiagnostics) {
                Get-Content -Raw -Encoding UTF8 $runtimeDiagnostics | Write-Host
              }
              throw "packaged executable probe failed: $($probeArgs -join ' ')"
            }
          }

          $preflightPayload = Get-Content -Raw -Encoding UTF8 $preflightReport | ConvertFrom-Json
          $visionCheck = @($preflightPayload.checks | Where-Object { $_.name -eq "vision_credential" })
          if ($visionCheck.Count -ne 1 -or $visionCheck[0].detail.configured -ne $false -or $visionCheck[0].detail.credential_source -ne "worker_backend") {
            throw "packaged Vision configuration must start without a credential"
          }

          Remove-Item Env:CHEJIN_PACKAGING_DIAGNOSTIC_PATH -ErrorAction SilentlyContinue
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "chejin-worker-default-diagnostic-probe"
          $defaultStartupDiagnostic = Join-Path $env:LOCALAPPDATA "CheJinWorker\diagnostics\startup-crash.jsonl"
          $normalStartupProbe = Start-Process -FilePath $exePath -ArgumentList @(
            "--preflight", "--skip-backend", "--skip-wechat", "--preflight-format", "json"
          ) -PassThru
          if (-not $normalStartupProbe.WaitForExit(120000)) {
            Stop-Process -Id $normalStartupProbe.Id -Force
            throw "normal packaged startup probe timed out"
          }
          if ($normalStartupProbe.ExitCode -ne 0) {
            throw "normal packaged startup probe failed"
          }
          if (Test-Path $defaultStartupDiagnostic) {
            throw "normal packaged startup produced a false crash diagnostic"
          }

          Remove-Item Env:CHEJIN_API_BASE_URL -ErrorAction SilentlyContinue
          $productionEndpointReport = Join-Path $env:RUNNER_TEMP "chejin-worker-production-endpoint-preflight.json"
          $productionEndpointProbe = Start-Process -FilePath $exePath -ArgumentList @(
            "--preflight", "--skip-wechat", "--preflight-format", "json",
            "--write-report", $productionEndpointReport
          ) -PassThru
          if (-not $productionEndpointProbe.WaitForExit(120000)) {
            Stop-Process -Id $productionEndpointProbe.Id -Force
            throw "packaged production endpoint probe timed out"
          }
          if ($productionEndpointProbe.ExitCode -ne 0) {
            Get-Content -Raw -Encoding UTF8 $productionEndpointReport | Write-Host
            throw "packaged production endpoint probe failed"
          }
          $productionEndpointPayload = Get-Content -Raw -Encoding UTF8 $productionEndpointReport | ConvertFrom-Json
          $productionBackendCheck = @($productionEndpointPayload.checks | Where-Object { $_.name -eq "backend" })
          if ($productionBackendCheck.Count -ne 1 -or
              $productionBackendCheck[0].ok -ne $true -or
              $productionBackendCheck[0].detail.url -ne "https://jiangsuchejin.com/readyz") {
            throw "packaged client does not default to the production backend"
          }

          $crashProbe = Start-Process -FilePath $exePath -ArgumentList @("--startup-crash-probe") -PassThru
          if (-not $crashProbe.WaitForExit(30000)) {
            Stop-Process -Id $crashProbe.Id -Force
            throw "intentional packaged startup crash probe timed out"
          }
          if ($crashProbe.ExitCode -eq 0) {
            throw "intentional packaged startup crash unexpectedly succeeded"
          }
          if (-not (Test-Path $defaultStartupDiagnostic)) {
            throw "packaged startup crash did not create the default diagnostic"
          }
          $startupCrash = Get-Content -Encoding UTF8 $defaultStartupDiagnostic | Select-Object -Last 1 | ConvertFrom-Json
          if ($startupCrash.version -ne "0.9.70" -or $startupCrash.build_commit -ne $env:GITHUB_SHA) {
            throw "startup crash diagnostic build identity mismatch"
          }
          foreach ($requiredField in @("timestamp", "windows_version", "exception_type", "traceback")) {
            if ([string]::IsNullOrWhiteSpace([string]$startupCrash.$requiredField)) {
              throw "startup crash diagnostic missing field: $requiredField"
            }
          }
          if (@(Get-ChildItem -Path (Split-Path $exePath) -Recurse -File -Filter "vision-runtime.json").Count -ne 0) {
            throw "package contains legacy Vision credentials"
          }

          Write-Host "Windows packaged executable validation passed."

      - name: Prepare verified delivery ZIP
        shell: powershell
        working-directory: worker-client
        env:
          CHEJIN_RELEASE_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.CHEJIN_RELEASE_SIGNING_PRIVATE_KEY_BASE64 }}
        run: |
          $ErrorActionPreference = "Stop"
          $sourceBaseCommit = "4998a5853154dde2c224a21a3eef66c7b6d7db99"
          git merge-base --is-ancestor $sourceBaseCommit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            throw "build commit is not based on required main@4998a58"
          }

          $reportsDir = Join-Path $PWD "dist\reports"
          $manifestPath = (Get-ChildItem -Path $reportsDir -Filter "*.manifest.json" -File -ErrorAction Stop).FullName
          $manifest = Get-Content -Raw -Encoding UTF8 $manifestPath | ConvertFrom-Json
          $packageDir = [string]$manifest.package_dir
          $releaseDir = Join-Path $PWD "dist\release"
          $zipName = "chejin-worker-v0.9.70-windows-x64.zip"
          $zipPath = Join-Path $releaseDir $zipName
          $deliveryManifestPath = Join-Path $releaseDir "chejin-worker-v0.9.70-windows-x64.delivery.json"
          $signedReleasePath = Join-Path $releaseDir "chejin-worker-v0.9.70-windows-x64.release.json"
          $sha256Path = Join-Path $releaseDir "chejin-worker-v0.9.70-windows-x64.sha256.txt"

          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          Compress-Archive -Path $packageDir -DestinationPath $zipPath -CompressionLevel Optimal -Force
          if (-not (Test-Path $zipPath)) {
            throw "delivery ZIP was not created"
          }

          $verifyDir = Join-Path $env:RUNNER_TEMP "chejin-worker-delivery-verify"
          Expand-Archive -LiteralPath $zipPath -DestinationPath $verifyDir -Force
          $verifiedExeCandidates = @(
            Get-ChildItem -Path $verifyDir -Filter "*.exe" -File -Recurse |
              Where-Object { (Get-FileHash -Algorithm SHA256 $_.FullName).Hash -eq $manifest.exe_sha256 }
          )
          if ($verifiedExeCandidates.Count -ne 1) {
            throw "delivery ZIP must contain exactly one executable matching the packaged SHA256; found $($verifiedExeCandidates.Count)"
          }
          $verifiedExePath = $verifiedExeCandidates[0].FullName
          $verifiedPackageRoot = Split-Path -Parent $verifiedExePath
          if ((Split-Path -Leaf $verifiedPackageRoot) -ne "CheJinWorkerClient") {
            throw "delivery ZIP root directory must be CheJinWorkerClient"
          }
          if ((Split-Path -Leaf $verifiedExePath) -ne "CheJinWorkerClient.exe") {
            throw "delivery ZIP executable must be CheJinWorkerClient.exe"
          }
          $verifiedUpdaterPath = Join-Path $verifiedPackageRoot "CheJinUpdater.exe"
          if (-not (Test-Path $verifiedUpdaterPath)) {
            throw "delivery ZIP does not contain CheJinUpdater.exe"
          }
          if ((Get-FileHash -Algorithm SHA256 $verifiedUpdaterPath).Hash -ne $manifest.updater_exe_sha256) {
            throw "delivery ZIP updater SHA256 mismatch"
          }
          $verifiedUpdateManifestPath = Join-Path $verifiedPackageRoot "update-package-manifest.json"
          if (-not (Test-Path $verifiedUpdateManifestPath)) {
            throw "delivery ZIP does not contain update-package-manifest.json"
          }
          if ((Get-FileHash -Algorithm SHA256 $verifiedUpdateManifestPath).Hash -ne $manifest.update_package_manifest_sha256) {
            throw "delivery ZIP update package manifest SHA256 mismatch"
          }
          $verifiedInternalPath = Join-Path $verifiedPackageRoot "_internal"
          if (-not (Test-Path $verifiedInternalPath)) {
            throw "delivery ZIP does not contain the packaged runtime directory"
          }
          $verifiedUatLauncherPath = Join-Path $verifiedPackageRoot "start-uat.ps1"
          if (-not (Test-Path $verifiedUatLauncherPath)) {
            throw "delivery ZIP does not contain start-uat.ps1 beside the executable"
          }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\validate-uat-launcher.ps1 -ScriptPath $verifiedUatLauncherPath
          if ($LASTEXITCODE -ne 0) {
            throw "delivery ZIP UAT launcher failed Windows PowerShell 5.1 BOM/parse gate"
          }
          $verifiedEvidenceCollectorPath = Join-Path $verifiedPackageRoot "collect-uat-evidence.ps1"
          if (-not (Test-Path $verifiedEvidenceCollectorPath)) {
            throw "delivery ZIP does not contain collect-uat-evidence.ps1 beside the executable"
          }
          $verifiedEvidenceHelperPath = Join-Path $verifiedPackageRoot "collect_uat_evidence.py"
          if (-not (Test-Path $verifiedEvidenceHelperPath)) {
            throw "delivery ZIP does not contain collect_uat_evidence.py beside the evidence collector"
          }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\validate-uat-launcher.ps1 -ScriptPath $verifiedEvidenceCollectorPath
          if ($LASTEXITCODE -ne 0) {
            throw "delivery ZIP UAT evidence collector failed Windows PowerShell 5.1 BOM/parse gate"
          }
          $verifiedExeHash = (Get-FileHash -Algorithm SHA256 $verifiedExePath).Hash
          if ($verifiedExeHash -ne $manifest.exe_sha256) {
            throw "delivery ZIP executable SHA256 mismatch"
          }
          $verifyRootPrefix = $verifyDir.TrimEnd("\") + "\"
          $verifiedExeRelativePath = $verifiedExePath.Substring($verifyRootPrefix.Length)

          $zipHash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash
          $deliveryManifest = [ordered]@{
            schema_version = 1
            app_name = [string]$manifest.app_name
            version = [string]$manifest.version
            default_api_base_url = [string]$manifest.default_api_base_url
            platform = "windows-x64"
            package_kind = "portable_zip"
            source_base_commit = $sourceBaseCommit
            build_commit = $env:GITHUB_SHA
            build_branch = $env:GITHUB_REF_NAME
            workflow_run_id = $env:GITHUB_RUN_ID
            zip_name = $zipName
            zip_sha256 = $zipHash
            exe_relative_path = $verifiedExeRelativePath
            exe_sha256 = [string]$manifest.exe_sha256
            updater_exe_sha256 = [string]$manifest.updater_exe_sha256
            update_package_manifest_sha256 = [string]$manifest.update_package_manifest_sha256
            file_count = [int]$manifest.file_count
            package_bytes = [long]$manifest.package_bytes
            tests_status = [string]$manifest.tests_status
            preflight_status = [string]$manifest.preflight_status
            vision_credential_embedded = [bool]$manifest.vision_credential_embedded
            vision_credential_source = [string]$manifest.vision_credential_source
            vision_configuration_locked = [bool]$manifest.vision_configuration_locked
            vision_provider = [string]$manifest.vision_provider
            vision_base_url = [string]$manifest.vision_base_url
            vision_model = [string]$manifest.vision_model
            vision_request_style = [string]$manifest.vision_request_style
            vision_live_probe_check = [string]$manifest.vision_live_probe_check
            uat_launcher_utf8_bom_check = "passed"
            uat_launcher_powershell_5_1_parse_check = "passed"
            client_delivery_boundary_check = [string]$manifest.client_delivery_boundary_check
            c2_contract_revision = [string]$manifest.c2_contract_revision
            c2_contract_sha256 = [string]$manifest.c2_contract_sha256
            omniauto_tree_sha256 = [string]$manifest.packaged_omniauto_tree_sha256
            created_at = (Get-Date).ToUniversalTime().ToString("o")
          }
          $deliveryManifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 $deliveryManifestPath
          "$($zipHash.ToLowerInvariant())  $zipName" | Set-Content -Encoding ASCII $sha256Path
          .\.venv\Scripts\python.exe .\scripts\sign-client-release.py `
            --archive $zipPath `
            --package-manifest $verifiedUpdateManifestPath `
            --version "0.9.70" `
            --git-commit $env:GITHUB_SHA `
            --artifact-storage-key "gray/windows-x64/$zipName" `
            --published-at ((Get-Date).ToUniversalTime().ToString("o")) `
            --key-id $env:CHEJIN_RELEASE_SIGNING_KEY_ID `
            --output $signedReleasePath
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $signedReleasePath)) {
            throw "signed client release descriptor was not created"
          }
          $signedReleaseText = Get-Content -Raw -Encoding UTF8 $signedReleasePath
          if ($signedReleaseText.Contains("artifact_url") -or $signedReleaseText.Contains("expires_at")) {
            throw "immutable release descriptor must not contain a temporary download URL"
          }

          Write-Host "Delivery ZIP: $zipPath"
          Write-Host "Delivery ZIP SHA256: $zipHash"
          Write-Host "Delivery manifest: $deliveryManifestPath"
          Write-Host "Signed release descriptor: $signedReleasePath"

      - name: Exercise original 0.9.69 settings update against exact signed ZIP
        shell: powershell
        working-directory: worker-client
        run: |
          $ErrorActionPreference = "Stop"
          .\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -r ..\backend\requirements.txt "playwright==1.55.0"
          if ($LASTEXITCODE -ne 0) { throw "GUI upgrade gate dependencies failed" }
          .\.venv\Scripts\python.exe scripts/run-windows-client-upgrade-test.py `
            --old-package-root (Join-Path $env:RUNNER_TEMP "old-069-release\CheJinWorkerClient") `
            --old-source-root (Join-Path $env:GITHUB_WORKSPACE ".old-source\worker-client") `
            --archive dist/release/chejin-worker-v0.9.70-windows-x64.zip `
            --release dist/release/chejin-worker-v0.9.70-windows-x64.release.json `
            --work-root (Join-Path $env:RUNNER_TEMP "chejin-original-client-upgrade")
          if ($LASTEXITCODE -ne 0) { throw "Original client button upgrade failed; production publication blocked" }
          $report = Get-Content -Raw -Encoding UTF8 (Join-Path $env:RUNNER_TEMP "chejin-original-client-upgrade/upgrade-result.json") | ConvertFrom-Json
          if ($report.status -ne "passed" -or @($report.cases).Count -ne 2) { throw "Original client evidence incomplete" }
          $path = "dist/release/chejin-worker-v0.9.70-windows-x64.delivery.json"
          $delivery = Get-Content -Raw -Encoding UTF8 $path | ConvertFrom-Json
          $delivery | Add-Member -NotePropertyName upgrade_start_version -NotePropertyValue "0.9.69" -Force
          $delivery | Add-Member -NotePropertyName original_client_upgrade_check -NotePropertyValue "passed" -Force
          $delivery | Add-Member -NotePropertyName original_client_upgrade_report_sha256 -NotePropertyValue ((Get-FileHash (Join-Path $env:RUNNER_TEMP "chejin-original-client-upgrade/upgrade-result.json") -Algorithm SHA256).Hash.ToLowerInvariant()) -Force
          $delivery | ConvertTo-Json -Depth 8 | Set-Content -Encoding UTF8 $path

      - name: Upload verified Windows client
        uses: actions/upload-artifact@v4
        with:
          name: chejin-worker-v0.9.70-windows-x64-${{ github.sha }}
          path: |
            worker-client/dist/release/chejin-worker-v0.9.70-windows-x64.zip
            worker-client/dist/release/chejin-worker-v0.9.70-windows-x64.delivery.json
            worker-client/dist/release/chejin-worker-v0.9.70-windows-x64.release.json
            worker-client/dist/release/chejin-worker-v0.9.70-windows-x64.sha256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Preserve Windows gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-gate-reports-${{ github.run_id }}
          path: |
            worker-client/dist/reports/*.json
            ${{ runner.temp }}/chejin-original-client-upgrade/**/result.json
            ${{ runner.temp }}/chejin-original-client-upgrade/upgrade-result.json
            ${{ runner.temp }}/chejin-original-client-upgrade/**/process.log
            ${{ runner.temp }}/chejin-original-client-upgrade/**/*.png
            ${{ runner.temp }}/chejin-original-client-upgrade/**/worker-startup.jsonl
            ${{ runner.temp }}/chejin-original-client-upgrade/**/update-result.json
            ${{ runner.temp }}/native-prebuild.xml
            ${{ runner.temp }}/chejin-updater-real-process/native-data-lock-tests.xml
            ${{ runner.temp }}/chejin-updater-real-process/**/update-result.json
            ${{ runner.temp }}/chejin-updater-real-process/**/worker-startup.jsonl
          if-no-files-found: warn
          retention-days: 30

  deliver:
    needs: [prepare, package]
    if: >-
      always() && !cancelled() && inputs.release_approved && needs.prepare.result == 'success' &&
      ((inputs.delivery_mode == 'build_and_stage' && needs.package.result == 'success') ||
       inputs.delivery_mode != 'build_and_stage')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ (inputs.delivery_mode == 'publish_staged' || inputs.delivery_mode == 'check_staged') && 'formal-production' || 'formal-staging' }}
    concurrency:
      group: formal-release-delivery
      cancel-in-progress: false
    env:
      OPERATION: ${{ inputs.delivery_mode }}
      FORMAL_RUN_ID: ${{ inputs.delivery_mode == 'build_and_stage' && github.run_id || inputs.formal_run_id }}
      CURRENT_VERSION: ${{ inputs.current_client_version }}
      STAGE_ID: ${{ inputs.stage_id }}
      PRODUCTION_READY: ${{ inputs.production_ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Validate formal source and select exact artifact
        id: source
        if: inputs.delivery_mode == 'build_and_stage' || inputs.delivery_mode == 'stage_existing'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ops/formal_release/select_artifact.py
      - name: Download formal artifact inside GitHub runner
        if: inputs.delivery_mode == 'build_and_stage' || inputs.delivery_mode == 'stage_existing'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          run-id: ${{ env.FORMAL_RUN_ID }}
          github-token: ${{ github.token }}
          path: formal-artifact
          merge-multiple: true
      - name: Transfer, verify or publish through restricted receiver
        env:
          FORMAL_SSH_KEY: ${{ secrets.FORMAL_SSH_KEY }}
          FORMAL_SSH_HOST: ${{ secrets.FORMAL_SSH_HOST }}
          FORMAL_SSH_PORT: ${{ secrets.FORMAL_SSH_PORT }}
          FORMAL_KNOWN_HOSTS: ${{ secrets.FORMAL_KNOWN_HOSTS }}
          FORMAL_API_ORIGIN: ${{ vars.FORMAL_API_ORIGIN }}
          FORMAL_DOWNLOAD_ORIGIN: ${{ vars.FORMAL_DOWNLOAD_ORIGIN }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          case "$OPERATION" in
            build_and_stage|stage_existing)
              python ops/formal_release/deliver.py stage --folder formal-artifact \
                --run-id "$FORMAL_RUN_ID" --commit "$SOURCE_COMMIT" --current-version "$CURRENT_VERSION"
              ;;
            check_staged|publish_staged)
              test "$PRODUCTION_READY" = true
              if [ "$OPERATION" = check_staged ]; then action=check; else action=publish; fi
              python ops/formal_release/deliver.py "$action" --stage-id "$STAGE_ID" \
                --current-version "$CURRENT_VERSION" --workers-drained
              ;;
            *) exit 2 ;;
          esac
      - name: Preserve sanitized delivery result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-delivery-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: formal-result.json
          if-no-files-found: warn
          retention-days: 30
      - name: Report an early delivery failure
        if: failure()
        run: |
          if [ ! -f formal-result.json ]; then
            echo '正式交付未完成：前置检查或 GitHub 产物下载失败。生产登记未执行，Windows 验收待完成。' >> "$GITHUB_STEP_SUMMARY"
          fi
