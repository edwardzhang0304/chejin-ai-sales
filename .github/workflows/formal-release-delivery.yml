name: Formal release delivery (no Fast UAT)

on:
  workflow_call:
    inputs:
      operation:
        required: true
        type: string
      formal_run_id:
        required: true
        type: string
      current_client_version:
        required: true
        type: string
      stage_id:
        required: true
        type: string
      production_ready:
        required: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ (inputs.operation == 'publish_staged' || inputs.operation == 'check_staged') && 'formal-production' || 'formal-staging' }}
    concurrency:
      group: formal-release-delivery
      cancel-in-progress: false
    env:
      OPERATION: ${{ inputs.operation }}
      FORMAL_RUN_ID: ${{ inputs.formal_run_id }}
      CURRENT_VERSION: ${{ inputs.current_client_version }}
      STAGE_ID: ${{ inputs.stage_id }}
      PRODUCTION_READY: ${{ inputs.production_ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Validate formal source and select exact artifact
        id: source
        if: inputs.operation == 'build_and_stage' || inputs.operation == 'stage_existing'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ops/formal_release/select_artifact.py
      - name: Download formal artifact inside GitHub runner
        if: inputs.operation == 'build_and_stage' || inputs.operation == 'stage_existing'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          run-id: ${{ inputs.formal_run_id }}
          github-token: ${{ github.token }}
          path: formal-artifact
          merge-multiple: true
      - name: Transfer, verify or publish through restricted receiver
        env:
          FORMAL_SSH_KEY: ${{ secrets.FORMAL_SSH_KEY }}
          FORMAL_SSH_HOST: ${{ secrets.FORMAL_SSH_HOST }}
          FORMAL_SSH_PORT: ${{ secrets.FORMAL_SSH_PORT }}
          FORMAL_KNOWN_HOSTS: ${{ secrets.FORMAL_KNOWN_HOSTS }}
          FORMAL_API_ORIGIN: ${{ vars.FORMAL_API_ORIGIN }}
          FORMAL_DOWNLOAD_ORIGIN: ${{ vars.FORMAL_DOWNLOAD_ORIGIN }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          case "$OPERATION" in
            build_and_stage|stage_existing)
              python ops/formal_release/deliver.py stage --folder formal-artifact \
                --run-id "$FORMAL_RUN_ID" --commit "$SOURCE_COMMIT" --current-version "$CURRENT_VERSION"
              ;;
            check_staged|publish_staged)
              test "$PRODUCTION_READY" = true
              if [ "$OPERATION" = check_staged ]; then action=check; else action=publish; fi
              python ops/formal_release/deliver.py "$action" --stage-id "$STAGE_ID" \
                --current-version "$CURRENT_VERSION" --workers-drained
              ;;
            *) exit 2 ;;
          esac
      - name: Preserve sanitized delivery result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-delivery-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: formal-result.json
          if-no-files-found: warn
          retention-days: 30
      - name: Report an early delivery failure
        if: failure()
        run: |
          if [ ! -f formal-result.json ]; then
            echo '正式交付未完成：前置检查或 GitHub 产物下载失败。生产登记未执行，Windows 验收待完成。' >> "$GITHUB_STEP_SUMMARY"
          fi
