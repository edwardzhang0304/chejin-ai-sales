name: Isolated Windows clock release checks
on:
  push:
    branches: ['codex/release-native-clock-01026']
    paths: ['ops/formal_release/check_clock_native.py', '.github/workflows/clock-native-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-clock:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Preserve sealed source bytes on disposable runner
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.10'}
      - name: Verify native ticket locking and shipped time helper on disposable runner
        run: python ops/formal_release/check_clock_native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clock-native-release-evidence
          path: ${{ runner.temp }}/clock-native-01026/result.json
          if-no-files-found: error
