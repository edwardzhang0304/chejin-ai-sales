name: Worker release checks
description: Shared source checks without building a Fast UAT or formal package
runs:
  using: composite
  steps:
    - name: Run credential security gate
      if: github.workflow != 'Worker Windows package gate' || env.CHEJIN_SHARED_CREDENTIALS_REUSED != 'true'
      working-directory: worker-client
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        python scripts/run-credential-security-checks.py
        if ($LASTEXITCODE -ne 0) {
          throw "Credential security gate failed"
        }

    - name: Run affected Worker and backend read-settlement tests
      if: github.workflow != 'Worker Windows package gate' || env.CHEJIN_SHARED_SETTLEMENT_REUSED != 'true'
      working-directory: .
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        $env:CHEJIN_WORKER_HOME = Join-Path $env:RUNNER_TEMP "chejin-worker-affected-tests"
        $env:PYTHONPATH = "$PWD\worker-client;$PWD\backend"
        python -m pytest worker-client/tests/test_task_runner.py -q `
          -k "visible_unread or inconclusive or inflight_flow or confirmed_ai_reply or image or candidate or continuity"
        if ($LASTEXITCODE -ne 0) {
          throw "Affected Worker read-settlement tests failed"
        }
        python -m pytest `
          worker-client/tests/test_c2_vision_integration.py `
          worker-client/tests/test_transaction_outcomes.py -q
        if ($LASTEXITCODE -ne 0) {
          throw "Affected image candidate and read-run receipt tests failed"
        }
        python -m pytest backend/tests/test_wechat_c2_api.py backend/tests/test_worker_client_api.py -q `
          -k "visible_unread or inconclusive or inflight_flow"
        if ($LASTEXITCODE -ne 0) {
          throw "Affected backend read-settlement tests failed"
        }

    - name: Run affected Worker recovery compatibility tests
      working-directory: worker-client
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        $env:CHEJIN_WORKER_HOME = Join-Path $env:RUNNER_TEMP "chejin-worker-affected-tests"
        $affectedFiles = @(
          "test_storage.py",
          "test_ui_contract.py",
          "test_web_ui_binding_behavior.py"
        )
        foreach ($testFile in $affectedFiles) {
          python -m unittest discover -s tests -p $testFile
          if ($LASTEXITCODE -ne 0) {
            throw "Affected Worker recovery test failed: $testFile"
          }
        }
        python -m unittest discover -s tests -p "test_task_runner.py" `
          -k restart -k faulted_is_persisted_locally_before_backend_sync
        if ($LASTEXITCODE -ne 0) {
          throw "Affected restart and fault-state tests failed"
        }

    - name: Run affected Brain context and Provider-input tests
      working-directory: .
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        $env:PYTHONUTF8 = "1"
        $env:PYTHONPATH = "$PWD\worker-client;$PWD\backend"
        python -m pytest backend/tests/test_c3_api.py backend/tests/test_c3_brain_context_bridge.py backend/tests/test_brain_fact_guidance_regression.py -q
        if ($LASTEXITCODE -ne 0) {
          throw "Affected Brain context bridge tests failed"
        }
        python worker-client\omniauto-rpa\apps\wechat_ai_customer_service\tests\run_customer_service_brain_contract_checks.py
        if ($LASTEXITCODE -ne 0) {
          throw "Brain Provider-input contract checks failed"
        }

    - name: Compare observability off and on business traces
      working-directory: .
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        $env:CHEJIN_WORKER_HOME = Join-Path $env:RUNNER_TEMP "chejin-worker-observability-neutrality"
        $env:PYTHONPATH = "$PWD\worker-client;$PWD\backend"
        python worker-client\scripts\run-observability-business-neutrality.py
        if ($LASTEXITCODE -ne 0) {
          throw "Observability changed a front-middle-back business trace"
        }

    - name: Run contract and packaging gates
      working-directory: worker-client
      shell: powershell
      run: |
        $ErrorActionPreference = "Stop"
        $env:CHEJIN_WORKER_HOME = Join-Path $env:RUNNER_TEMP "chejin-worker-contract-tests"
        python scripts/generate-c2-observation-schema.py --check
        if ($LASTEXITCODE -ne 0) {
          throw "Generated C2 observation schema is stale"
        }
        $contractFiles = @(
          "test_c2_contract.py",
          "test_packaging_entry.py",
          "test_packaging_scripts.py"
        )
        foreach ($testFile in $contractFiles) {
          python -m unittest discover -s tests -p $testFile
          if ($LASTEXITCODE -ne 0) {
            throw "Contract or packaging gate failed: $testFile"
          }
        }

